<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接码管理端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .copy-btn:active { transform: scale(0.95); }
        .status-waiting { color: #f59e0b; }
        .status-received { color: #10b981; }
        .status-cancelled { color: #ef4444; }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .pulse-dot { animation: pulse-dot 1.5s infinite; }
        .plan-btn.active { background-color: #3b82f6; color: white; }
        @media(max-width:768px){
            .max-w-7xl{padding-left:12px!important;padding-right:12px!important}
            header h1{font-size:16px}
            .grid.lg\:grid-cols-3{grid-template-columns:1fr!important}
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold text-gray-800">接码管理端</h1>
            <div class="text-sm text-gray-400">专业接码服务</div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- 左侧：购买面板 -->
        <div class="lg:col-span-1">
            <div class="bg-white rounded-lg shadow p-6 space-y-4">
                <h2 class="text-lg font-semibold text-gray-700">购买号码</h2>

                <!-- 国家选择 -->
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">
                        选择国家 <span id="countryCount" class="text-xs text-gray-400 font-normal"></span>
                    </label>
                    <input id="countrySearch" type="text" placeholder="搜索国家（中文/英文）..." class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm mb-2 focus:ring-2 focus:ring-blue-500">
                    <select id="countrySelect" size="8" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">加载中...</option>
                    </select>
                </div>

                <!-- 服务选择 -->
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">
                        选择服务 <span id="projectCount" class="text-xs text-gray-400 font-normal"></span>
                    </label>
                    <input id="projectSearch" type="text" placeholder="搜索服务..." class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm mb-2 focus:ring-2 focus:ring-blue-500">
                    <select id="projectSelect" size="8" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
                        <option value="">加载中...</option>
                    </select>
                </div>

                <!-- 套餐选择 -->
                <div id="planSection" class="hidden">
                    <label class="block text-sm font-medium text-gray-600 mb-2">选择套餐</label>
                    <div class="flex gap-2 mb-3">
                        <button type="button" onclick="selectPlan('week')" class="plan-btn flex-1 py-2 px-3 text-sm rounded-md border border-gray-300 hover:bg-blue-50 transition font-medium" data-plan="week">
                            周租
                        </button>
                        <button type="button" onclick="selectPlan('month')" class="plan-btn flex-1 py-2 px-3 text-sm rounded-md border border-gray-300 hover:bg-blue-50 transition font-medium" data-plan="month">
                            月租
                        </button>
                        <button type="button" onclick="selectPlan('year')" class="plan-btn flex-1 py-2 px-3 text-sm rounded-md border border-gray-300 hover:bg-blue-50 transition font-medium" data-plan="year">
                            年租
                        </button>
                    </div>

                    <!-- 数量选择 -->
                    <div class="flex items-center gap-3 mb-3">
                        <label class="text-sm text-gray-600">数量：</label>
                        <div class="flex items-center border border-gray-300 rounded-md">
                            <button type="button" onclick="changeQty(-1)" class="px-3 py-1 text-gray-500 hover:bg-gray-100 rounded-l-md">-</button>
                            <span id="qtyDisplay" class="px-4 py-1 text-sm font-semibold border-x border-gray-300">1</span>
                            <button type="button" onclick="changeQty(1)" class="px-3 py-1 text-gray-500 hover:bg-gray-100 rounded-r-md">+</button>
                        </div>
                    </div>

                    <!-- 价格展示 -->
                    <div class="bg-blue-50 rounded-md p-3 text-sm space-y-1">
                        <div class="flex justify-between">
                            <span class="text-gray-600">单价：</span>
                            <span id="unitPrice" class="font-semibold text-blue-700">--</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">数量：</span>
                            <span id="qtyInfo" class="font-semibold text-blue-700">--</span>
                        </div>
                        <div class="flex justify-between border-t border-blue-200 pt-1 mt-1">
                            <span class="text-gray-700 font-medium">合计：</span>
                            <span id="totalPrice" class="font-bold text-blue-800 text-base">--</span>
                        </div>
                        <div class="flex justify-between mt-1">
                            <span class="text-gray-600">可用号码：</span>
                            <span id="stockValue" class="font-semibold text-blue-700">--</span>
                        </div>
                    </div>
                </div>

                <!-- 购买按钮 -->
                <button id="buyBtn" onclick="purchase()" disabled
                    class="w-full bg-blue-600 text-white py-2.5 rounded-md font-medium hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition">
                    购买号码
                </button>

                <div id="buyError" class="hidden text-red-500 text-sm"></div>
            </div>
        </div>

        <!-- 右侧：已购号码列表 -->
        <div class="lg:col-span-2">
            <div class="bg-white rounded-lg shadow">
                <div class="px-6 py-4 border-b flex items-center justify-between">
                    <h2 class="text-lg font-semibold text-gray-700">已购号码</h2>
                    <span id="orderCount" class="text-sm text-gray-400">0 个</span>
                </div>

                <div id="orderList" class="divide-y">
                    <div class="px-6 py-12 text-center text-gray-400">
                        暂无已购号码，请在左侧购买
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/client.js"></script>
</body>
</html>

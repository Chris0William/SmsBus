<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS接码平台</title>
    <link rel="stylesheet" href="/lib/element-plus.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body,#app{height:100%;font-family:'Helvetica Neue',Helvetica,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif}

        /* === Sidebar === */
        .sidebar{background:linear-gradient(180deg,#1e293b,#0f172a);transition:width .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden;box-shadow:2px 0 8px rgba(0,0,0,.08)}
        .sidebar-logo{height:56px;display:flex;align-items:center;padding:0 16px;gap:10px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
        .sidebar-logo .icon{width:32px;height:32px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0}
        .sidebar-logo .title{color:#e2e8f0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden}
        .sidebar .el-menu{border-right:none!important;background:transparent!important;flex:1;overflow-y:auto;padding:8px 0}
        .sidebar .el-menu-item,.sidebar .el-sub-menu__title{height:44px;line-height:44px;color:#94a3b8!important;margin:2px 8px;border-radius:8px}
        .sidebar .el-menu--collapse .el-menu-item{padding:0 0!important;justify-content:center;margin:2px 4px}
        .sidebar .el-menu-item:hover{background:rgba(255,255,255,.06)!important;color:#e2e8f0!important}
        .sidebar .el-menu-item.is-active{background:rgba(59,130,246,.15)!important;color:#60a5fa!important}
        .sidebar .el-menu-item .el-icon{color:inherit}
        .sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0}
        .sidebar-footer .email{color:#94a3b8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .sidebar-footer .balance{color:#60a5fa;font-size:13px;font-weight:600;margin-top:2px}

        /* === Header === */
        .app-header{height:56px!important;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 24px!important}
        .app-header .left{display:flex;align-items:center;gap:12px}
        .app-header .breadcrumb{color:#374151;font-size:15px;font-weight:600}
        .app-header .right{display:flex;align-items:center;gap:16px}

        /* === Main === */
        .app-main{background:#f5f7fa!important;padding:20px!important;overflow-y:auto!important}

        /* === Cards === */
        .content-card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:24px;margin-bottom:16px}
        .card-title{font-size:16px;font-weight:600;color:#1e293b;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}

        /* === Login === */
        .login-bg{min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;align-items:center;justify-content:center;padding:20px}
        .login-card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.15);width:100%;max-width:420px;padding:40px}

        /* === CAPTCHA === */
        .captcha-container{position:relative;background:#e2e8f0;border-radius:8px 8px 0 0;overflow:hidden}
        .captcha-canvas{width:100%;display:block}
        .captcha-piece{position:absolute;box-shadow:0 0 10px rgba(0,0,0,.3);pointer-events:none}
        .slider-track{position:relative;height:40px;background:#e8e8e8;border-radius:0 0 8px 8px;overflow:hidden}
        .slider-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#91d5ff;transition:none}
        .slider-fill.ok{background:#52c41a;width:100%!important;transition:width .3s}
        .slider-fill.fail{background:#ff4d4f;transition:background .2s}
        .slider-thumb{position:absolute;left:0;top:2px;width:36px;height:36px;background:#fff;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;cursor:grab;z-index:2;font-size:16px;color:#666;user-select:none}
        .slider-thumb:active{cursor:grabbing}
        .slider-thumb.ok{background:#52c41a;color:#fff}
        .slider-thumb.fail{background:#ff4d4f;color:#fff}
        .slider-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#999;font-size:13px;pointer-events:none;user-select:none}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

        /* === Transitions === */
        .fade-enter-active,.fade-leave-active{transition:opacity .3s ease}
        .fade-enter-from,.fade-leave-to{opacity:0}
        .slide-fade-enter-active{transition:all .3s ease-out}
        .slide-fade-leave-active{transition:all .15s ease-in}
        .slide-fade-enter-from{opacity:0;transform:translateY(12px)}
        .slide-fade-leave-to{opacity:0;transform:translateY(-8px)}

        /* === Status === */
        .status-waiting{color:#e6a23c}.status-activating{color:#a855f7}.status-active{color:#3b82f6}
        .status-received{color:#67c23a}.status-cancelled{color:#909399}.status-expired{color:#f56c6c}
        @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
        .pulse-dot{animation:pulse-dot 1.5s infinite}

        /* === Responsive === */
        .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999}
        .sidebar-overlay.active{display:block}
        @media(max-width:768px){
            .sidebar{position:fixed!important;z-index:1000;height:100%!important;width:220px!important;transform:translateX(-100%);transition:transform .3s ease}
            .sidebar.mobile-open{transform:translateX(0)}
            .app-header{padding:0 12px!important}
            .app-header .right span[id]{display:none}
            .app-main{padding:12px!important}
            .content-card{padding:14px;margin-bottom:10px}
            .card-title{font-size:14px;flex-wrap:wrap;gap:8px}
            .login-card{padding:24px;margin:0 8px}
            .el-dialog{--el-dialog-width:92%!important;margin:0 auto}
            .el-table{font-size:12px}
            .el-table .cell{padding:4px 8px!important}
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="/lib/vue.global.prod.js"></script>
    <script src="/lib/vue-router.global.prod.js"></script>
    <script src="/lib/element-plus.min.js"></script>
    <script src="/lib/element-plus-icons.iife.min.js"></script>

    <script src="/js/shared-data.js"></script>
    <script src="/js/views/LoginView.js"></script>
    <script src="/js/views/UserView.js"></script>
    <script src="/js/views/AdminView.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户面板 - SMS接码平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media(max-width:768px){
            .max-w-6xl{padding-left:12px!important;padding-right:12px!important}
            nav .max-w-6xl{flex-wrap:wrap;gap:4px}
            table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
            table th,table td{font-size:12px;padding:6px 8px}
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <span class="font-bold text-lg text-gray-800">SMS接码平台</span>
            <div class="flex items-center gap-4">
                <span id="userInfo" class="text-sm text-gray-600"></span>
                <button onclick="doLogout()" class="text-sm text-red-500 hover:text-red-700">退出</button>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-6">
        <!-- 标签切换 -->
        <div class="flex gap-2 mb-4">
            <button onclick="switchTab('activation')" id="tabAct" class="px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white">临时接码</button>
            <button onclick="switchTab('rental')" id="tabRent" class="px-4 py-2 rounded-lg text-sm font-medium bg-gray-200 text-gray-700">租赁</button>
            <button onclick="switchTab('orders')" id="tabOrders" class="px-4 py-2 rounded-lg text-sm font-medium bg-gray-200 text-gray-700">我的订单</button>
            <button onclick="switchTab('transactions')" id="tabTx" class="px-4 py-2 rounded-lg text-sm font-medium bg-gray-200 text-gray-700">余额流水</button>
        </div>

        <!-- 临时接码面板 -->
        <div id="panelActivation" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white rounded-lg shadow p-4">
                <h3 class="font-medium mb-3">选择服务</h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">国家代码</label>
                        <input id="actCountry" value="RU" class="w-full border rounded px-3 py-2 text-sm" placeholder="如: RU, UK, US">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">服务代码</label>
                        <input id="actService" value="opt4" class="w-full border rounded px-3 py-2 text-sm" placeholder="如: opt4(Telegram)">
                    </div>
                    <button onclick="queryActivation()" class="w-full bg-gray-100 text-gray-700 py-2 rounded text-sm hover:bg-gray-200">查询可用数量和价格</button>
                    <div id="actInfo" class="hidden text-sm p-3 bg-blue-50 rounded">
                        <p>可用: <span id="actCount">-</span> 个</p>
                        <p>价格: <span id="actPrice">-</span></p>
                    </div>
                    <button onclick="buyActivation()" id="actBuyBtn" class="hidden w-full bg-blue-600 text-white py-2 rounded text-sm hover:bg-blue-700 disabled:bg-gray-300">购买</button>
                </div>
            </div>
            <div id="actResult" class="bg-white rounded-lg shadow p-4 hidden">
                <h3 class="font-medium mb-3">购买结果</h3>
                <div id="actResultContent"></div>
            </div>
        </div>

        <!-- 租赁面板 -->
        <div id="panelRental" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
            <div class="bg-white rounded-lg shadow p-4">
                <h3 class="font-medium mb-3">租赁服务</h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">国家</label>
                        <select id="rentCountry" class="w-full border rounded px-3 py-2 text-sm" onchange="loadRentalServices()"></select>
                    </div>
                    <div class="flex gap-2">
                        <div class="flex-1">
                            <label class="block text-sm text-gray-600 mb-1">时长类型</label>
                            <select id="rentDtype" class="w-full border rounded px-3 py-2 text-sm" onchange="loadRentalServices()">
                                <option value="week">周</option>
                                <option value="month">月</option>
                            </select>
                        </div>
                        <div class="flex-1">
                            <label class="block text-sm text-gray-600 mb-1">数量</label>
                            <input id="rentDcount" type="number" value="1" min="1" class="w-full border rounded px-3 py-2 text-sm" onchange="loadRentalServices()">
                        </div>
                    </div>
                    <div id="rentServices" class="space-y-2 max-h-60 overflow-y-auto"></div>
                </div>
            </div>
            <div id="rentResult" class="bg-white rounded-lg shadow p-4 hidden">
                <h3 class="font-medium mb-3">租赁结果</h3>
                <div id="rentResultContent"></div>
            </div>
        </div>

        <!-- 我的订单 -->
        <div id="panelOrders" class="hidden">
            <div class="bg-white rounded-lg shadow p-4">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-medium">我的订单</h3>
                    <button onclick="loadOrders()" class="text-sm text-blue-600 hover:text-blue-800">刷新</button>
                </div>
                <div id="ordersList" class="space-y-3"></div>
                <p id="ordersEmpty" class="hidden text-gray-400 text-sm text-center py-8">暂无订单</p>
            </div>
        </div>

        <!-- 余额流水 -->
        <div id="panelTransactions" class="hidden">
            <div class="bg-white rounded-lg shadow p-4">
                <h3 class="font-medium mb-3">余额流水</h3>
                <table class="w-full text-sm">
                    <thead><tr class="text-left text-gray-500 border-b">
                        <th class="py-2">时间</th><th>类型</th><th>金额</th><th>说明</th>
                    </tr></thead>
                    <tbody id="txList"></tbody>
                </table>
                <p id="txEmpty" class="hidden text-gray-400 text-sm text-center py-8">暂无记录</p>
            </div>
        </div>
    </div>

    <script src="/dashboard/user.js"></script>
</body>
</html>
